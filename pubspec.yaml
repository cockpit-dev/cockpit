name: cockpit_workspace
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'

workspace:
  - packages/cockpit_protocol
  - packages/flutter_cockpit
  - packages/flutter_cockpit_test
  - packages/cockpit_test
  - packages/cockpit
  - packages/cockpit_console
  - examples/cockpit_demo
  - examples/cockpit_demo/cockpit

dev_dependencies:
  args: ^2.7.0
  cockpit:
    path: packages/cockpit
  cockpit_protocol:
    path: packages/cockpit_protocol
  crypto: ^3.0.7
  lints: ^6.1.0
  melos: 6.3.3
  path: ^1.9.1
  test: '>=1.25.15 <2.0.0'
  yaml: ^3.1.3

flutter:
  uses-material-design: true
