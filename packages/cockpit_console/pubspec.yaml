name: cockpit_console
description: Desktop GUI client for Cockpit E2E automation with AI and declarative modes.
publish_to: none
version: 1.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  acpd: ^1.0.0
  acpd_io: ^1.0.0
  cockpit: ^4.0.34
  cockpit_protocol: ^4.0.34
  collection: ^1.19.1
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_riverpod: ^3.0.0
  hive_ce: ^2.19.3
  hooks_riverpod: ^3.0.0
  kache: ^2.0.0
  kache_hive_ce: ^2.0.0
  lucide_icons_flutter: ^3.1.15
  path: ^1.9.0
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_cockpit: ^4.0.34
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/cockpit_console_app_icon.png
