name: cockpit
description: Production E2E automation CLI, daemon, MCP, drivers, and reports for Flutter and black-box apps.
version: 2.2.0
homepage: https://github.com/cockpit-dev/cockpit
repository: https://github.com/cockpit-dev/cockpit
issue_tracker: https://github.com/cockpit-dev/cockpit/issues
documentation: https://github.com/cockpit-dev/cockpit/tree/main/packages/cockpit
topics:
  - flutter
  - cli
  - tooling
  - ai
  - mcp
executables:
  cockpit:
  cockpit_mcp:
  cockpit_worker:
  cockpitd:

environment:
  sdk: '>=3.8.0 <4.0.0'

resolution: workspace

dependencies:
  args: ^2.7.0
  dart_mcp: ^0.5.2
  file: ^7.0.1
  ffi: ^2.1.4
  cockpit_protocol: ^2.2.0
  crypto: ^3.0.6
  http: ^1.3.0
  image: ^4.5.4
  json_schema: ^5.2.2
  path: ^1.9.0
  process: ^5.0.3
  source_span: ^1.10.0
  stream_channel: ^2.1.4
  yaml: ^3.1.3
  xml: ^6.5.0

  collection: ^1.19.1
dev_dependencies:
  lints: ^6.1.0
  test: '>=1.25.15 <2.0.0'
