name: cockpit_workspace

packages:
  - packages/cockpit_protocol
  - packages/flutter_cockpit
  - packages/cockpit
  - examples/cockpit_demo
  - examples/cockpit_demo/cockpit

scripts:
  analyze:
    run: dart analyze
  test:
    run: >-
      (dart test test) &&
      (flutter test --no-pub packages/flutter_cockpit/test) &&
      (dart test packages/cockpit/test) &&
      (cd examples/cockpit_demo && flutter test --no-pub) &&
      (cd examples/cockpit_demo/cockpit && flutter test --no-pub)
