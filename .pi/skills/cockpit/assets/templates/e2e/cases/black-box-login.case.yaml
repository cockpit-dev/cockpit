schemaVersion: cockpit.test/v2
kind: case
id: blackBoxLogin
name: Black-box login
description: Controls an installed application without application instrumentation.
tags: [acceptance, black-box, authentication]
target:
  platform: android
  targetKind: nativeApp
  plane: native
  appId: com.example.app
defaults:
  commandTimeoutMs: 20000
  cleanupTimeoutMs: 30000
  failFast: true
  evidence:
    screenshot: onFailure
    snapshot: onFailure
    failurePolicy: failStep
variables:
  username:
    source: input
    type: string
    required: true
  password:
    source: secret
    type: string
    reference: env:COCKPIT_TEST_PASSWORD
fragments:
  assertHome:
    - stepId: waitForHome
      retry:
        maxAttempts: 3
        delayMs: 500
        steps:
          - stepId: assertHomeTitle
            action:
              type: assertVisible
              locator:
                nativeId: home_title
                fallbacks:
                  - {label: Home}
                  - {text: Home}
setup:
  - stepId: captureLoginBaseline
    action:
      type: captureScreenshot
      artifactName: login-baseline
      captureOptions:
        reason: before_action
        includeSnapshot: true
        attachToStep: true
        allowFallback: true
  - stepId: startLoginRecording
    timeoutMs: 30000
    startRecording:
      name: black-box-login
      purpose: acceptance
      mode: auto
      allowFallback: true
      attachToStep: true
steps:
  - stepId: enterUsername
    action:
      type: enterText
      locator:
        nativeId: username
        fallbacks:
          - {label: Email, matchMode: contains}
          - {text: Email, matchMode: contains}
      text: {$var: username}
  - stepId: enterPassword
    safety:
      effects: [credentialSensitive]
      reason: Authenticate a dedicated test account.
    action:
      type: enterText
      locator:
        nativeId: password
        fallbacks:
          - {label: Password, matchMode: contains}
          - {text: Password, matchMode: contains}
      text: {$var: password}
  - stepId: submitLogin
    action:
      type: tap
      locator:
        nativeId: login
        enabled: true
        fallbacks:
          - {label: Sign in}
          - {text: Sign in}
      activation: auto
  - stepId: verifyHome
    timeoutMs: 45000
    call: {fragment: assertHome}
  - stepId: captureLoginResult
    evidence: {screenshot: always, snapshot: always, failurePolicy: failStep}
    action:
      type: captureScreenshot
      artifactName: login-result
      captureOptions:
        reason: acceptance
        includeSnapshot: true
        attachToStep: true
        profile: acceptance
        allowFallback: true
finally:
  - stepId: stopLoginRecording
    timeoutMs: 30000
    stopRecording: {settleMs: 500}
