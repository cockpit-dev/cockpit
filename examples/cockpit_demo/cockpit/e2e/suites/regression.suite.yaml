schemaVersion: cockpit.test/v2
kind: suite
id: cockpitDemoRegression
name: Cockpit demo regression
description: Full Cockpit release acceptance across workflow and report capabilities.
tags: [acceptance, regression]
execution:
  maxConcurrency: 1
  failFast: false
  isolation: sharedSession
  retry:
    maxAttempts: 2
    delayMs: 500
    retryOn: [blocked, interrupted, internalError]
report:
  formats: [json, junit, html, summary]
  includePassedAttempts: true
matrix:
  axes:
    variant: [primary, alternate]
  maxCombinations: 4
fixtures:
  - id: suiteBaseline
    scope: suite
    setup:
      kind: file
      relativePath: e2e/fixtures/suite_setup.case.yaml
      caseId: demoSuiteSetup
    teardown:
      kind: file
      relativePath: e2e/fixtures/suite_teardown.case.yaml
      caseId: demoSuiteTeardown
  - id: attemptBaseline
    scope: caseAttempt
    dependsOn: [suiteBaseline]
    setup:
      kind: file
      relativePath: e2e/fixtures/attempt_setup.case.yaml
      caseId: demoAttemptSetup
    teardown:
      kind: file
      relativePath: e2e/fixtures/attempt_teardown.case.yaml
      caseId: demoAttemptTeardown
cases:
  - id: taskEditorValidation
    fixtures: [attemptBaseline]
    inputs:
      launchConfigurationLabel: Cockpit launch configuration
      taskTitle: Cockpit acceptance task
    source:
      kind: file
      relativePath: e2e/cases/task_editor_validation.case.yaml
      caseId: demoTaskEditorValidation
  - id: settingsNavigation
    fixtures: [suiteBaseline]
    source:
      kind: file
      relativePath: e2e/cases/settings_navigation.case.yaml
      caseId: demoSettingsNavigation
  - id: visualRegression
    fixtures: [suiteBaseline]
    tags: [requires-visual-regression]
    source:
      kind: file
      relativePath: e2e/cases/visual_regression.case.yaml
      caseId: demoVisualRegression
  - id: commandGestureCoverage
    fixtures: [attemptBaseline]
    source:
      kind: file
      relativePath: e2e/cases/command_gesture_coverage.case.yaml
      caseId: demoCommandGestureCoverage
  - id: mixedPlaneBlackBox
    fixtures: [suiteBaseline]
    tags: [requires-system-control]
    source:
      kind: file
      relativePath: e2e/cases/mixed_plane_black_box.case.yaml
      caseId: demoMixedPlaneBlackBox
  - id: locationTravel
    fixtures: [suiteBaseline]
    tags: [requires-location-travel]
    source:
      kind: file
      relativePath: e2e/cases/location_travel.case.yaml
      caseId: demoLocationTravel
  - id: matrixEvidence
    fixtures: [suiteBaseline]
    matrixAxes: [variant]
    inputs:
      variant: {$matrix: variant}
    source:
      kind: file
      relativePath: e2e/cases/matrix_evidence.case.yaml
      caseId: demoMatrixEvidence
  - id: nativeBlackBox
    tags: [requires-native-black-box]
    source:
      kind: file
      relativePath: e2e/cases/native_black_box.case.yaml
      caseId: demoNativeBlackBox
  - id: recordingLifecycle
    fixtures: [suiteBaseline]
    tags: [requires-recording]
    source:
      kind: file
      relativePath: e2e/cases/recording_lifecycle.case.yaml
      caseId: demoRecordingLifecycle
  # Keep command semantic coverage declared last: it is the only case that
  # drives the platform text-input keyboard, and on iOS the Flutter engine
  # (3.47.x) tears down the exposed accessibility tree a few seconds after a
  # focused text input on a pushed route loses its keyboard. The acceptance
  # runner enforces ordering against the native-plane cases on iOS (see
  # tool/src/cockpit_demo_acceptance_runner.dart); declaration order alone is
  # only a scheduling hint, and hard dependsOn edges here would block this
  # case on platforms where the native-plane cases are excluded.
  - id: commandSemanticCoverage
    fixtures: [suiteBaseline]
    source:
      kind: file
      relativePath: e2e/cases/command_semantic_coverage.case.yaml
      caseId: demoCommandSemanticCoverage
