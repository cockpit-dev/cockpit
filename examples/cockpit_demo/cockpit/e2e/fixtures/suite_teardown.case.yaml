schemaVersion: cockpit.test/v2
kind: case
id: demoSuiteTeardown
name: Suite baseline teardown
target: {platform: flutter, targetKind: flutterApp, plane: semantic}
defaults:
  commandTimeoutMs: 15000
  cleanupTimeoutMs: 12000
  failFast: true
  evidence: {screenshot: onFailure, snapshot: onFailure, failurePolicy: failStep}
steps:
  - stepId: verifySuiteFinalRoute
    description: Verify suite cleanup retained the inbox baseline
    timeoutMs: 15000
    evidence: {screenshot: always, snapshot: always, failurePolicy: failStep}
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
