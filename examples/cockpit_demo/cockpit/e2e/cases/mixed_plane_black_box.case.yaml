schemaVersion: cockpit.test/v2
kind: case
id: demoMixedPlaneBlackBox
name: Mixed-plane black-box validation
description: Uses system control without app instrumentation, then verifies observable Flutter UI state.
tags: [acceptance, black-box, mixed-plane, requires-system-control]
target:
  platform: flutter
  targetKind: flutterApp
  plane: semantic
defaults:
  commandTimeoutMs: 20000
  cleanupTimeoutMs: 12000
  failFast: true
  evidence:
    screenshot: onFailure
    snapshot: onFailure
    failurePolicy: failStep
setup:
  - stepId: verifyMixedPlaneBaseline
    timeoutMs: 12000
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
steps:
  - stepId: recoverAppThroughSystemControl
    description: Exercise the secondary black-box driver against the launched application.
    plane: native
    timeoutMs: 60000
    action:
      type: system
      name: recoverToApp
  - stepId: waitForNativeUiAfterRecovery
    description: Wait for the recovered application to become stable before native interaction.
    plane: native
    timeoutMs: 30000
    action: {type: waitForUiIdle, quietMs: 750}
  - stepId: openEditorThroughNativeLocator
    description: Prove non-invasive native locator resolution and interaction against Flutter UI.
    plane: native
    timeoutMs: 30000
    action:
      type: tap
      locator:
        label: New task
        fallbacks:
          - text: New task
  - stepId: verifyEditorAfterNativeAction
    timeoutMs: 12000
    action:
      type: waitFor
      condition: {type: route, route: /editor}
  - stepId: returnFromNativeOpenedEditor
    timeoutMs: 12000
    action: {type: back}
  - stepId: verifyRouteAfterBlackBoxControl
    timeoutMs: 12000
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
  - stepId: verifyUiAfterBlackBoxControl
    timeoutMs: 12000
    evidence: {screenshot: always, snapshot: always, failurePolicy: failStep}
    action:
      type: assertVisible
      locator: {text: New task}
  - stepId: captureMixedPlaneEvidence
    timeoutMs: 20000
    action:
      type: captureScreenshot
      artifactName: mixed-plane-black-box
      captureOptions: {reason: acceptance, includeSnapshot: true, attachToStep: true, allowFallback: true}
finally:
  - stepId: verifyMixedPlaneCleanup
    timeoutMs: 12000
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
