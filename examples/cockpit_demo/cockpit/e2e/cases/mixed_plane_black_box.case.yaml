schemaVersion: cockpit.test/v2
kind: case
id: demoMixedPlaneBlackBox
name: Mixed-plane black-box validation
description: Uses system control without app instrumentation, then verifies observable Flutter UI state.
tags: [acceptance, black-box, mixed-plane, requires-system-control]
target:
  platform: flutter
  targetKind: flutterApp
  plane: semantic
defaults:
  commandTimeoutMs: 20000
  cleanupTimeoutMs: 60000
  failFast: true
  evidence:
    screenshot: onFailure
    snapshot: onFailure
    failurePolicy: failStep
setup:
  - stepId: verifyMixedPlaneBaseline
    timeoutMs: 12000
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
steps:
  - stepId: recoverAppThroughSystemControl
    description: Exercise the secondary black-box driver against the launched application.
    plane: native
    timeoutMs: 60000
    action:
      type: system
      name: recoverToApp
  - stepId: waitForNativeUiAfterRecovery
    description: Wait for the recovered application to become stable before native interaction.
    plane: native
    timeoutMs: 30000
    action: {type: waitForUiIdle, quietMs: 750}
  - stepId: openEditorThroughNativeLocator
    description: Commit the native mutation once; later retries only observe its result.
    plane: native
    timeoutMs: 30000
    action:
      type: tap
      locator:
        label: New task
        fallbacks:
          - text: New task
  - stepId: observeEditorAfterNativeAction
    description: Retry only the read-only Flutter route postcondition.
    timeoutMs: 45000
    retry:
      maxAttempts: 3
      delayMs: 750
      steps:
        - stepId: verifyEditorAfterNativeAction
          timeoutMs: 12000
          action:
            type: waitFor
            condition: {type: route, route: /editor}
  - stepId: returnFromNativeOpenedEditor
    timeoutMs: 12000
    action: {type: back}
  - stepId: observeRouteAfterBlackBoxControl
    timeoutMs: 30000
    retry:
      maxAttempts: 3
      delayMs: 500
      steps:
        - stepId: verifyRouteAfterBlackBoxControl
          timeoutMs: 8000
          action:
            type: waitFor
            condition: {type: route, route: /inbox}
  - stepId: verifyUiAfterBlackBoxControl
    timeoutMs: 12000
    evidence: {screenshot: always, snapshot: always, failurePolicy: failStep}
    action:
      type: assertVisible
      locator: {text: New task}
  - stepId: captureMixedPlaneEvidence
    timeoutMs: 20000
    action:
      type: captureScreenshot
      artifactName: mixed-plane-black-box
      captureOptions: {reason: acceptance, includeSnapshot: true, attachToStep: true, allowFallback: true}
finally:
  - stepId: restoreMixedPlaneInboxIfNeeded
    description: Return only when the observed Flutter route proves the editor is open.
    timeoutMs: 20000
    if:
      condition: {type: route, route: /editor}
      then:
        - stepId: backFromEditorDuringMixedCleanup
          timeoutMs: 12000
          action: {type: back}
      else:
        - stepId: retainMixedPlaneRoute
          action: {type: waitForUiIdle, quietMs: 100}
  - stepId: observeMixedPlaneCleanup
    timeoutMs: 30000
    retry:
      maxAttempts: 3
      delayMs: 500
      steps:
        - stepId: verifyMixedPlaneCleanup
          timeoutMs: 8000
          action:
            type: waitFor
            condition: {type: route, route: /inbox}
