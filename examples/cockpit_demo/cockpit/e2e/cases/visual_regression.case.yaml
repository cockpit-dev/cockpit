schemaVersion: cockpit.test/v2
kind: case
id: demoVisualRegression
name: Visual regression coverage
description: Compares the stable Inbox surface with a runtime baseline captured from the same target and preserves actual, baseline, and diff evidence.
tags: [acceptance, visual-regression, requires-visual-regression]
target:
  platform: flutter
  targetKind: flutterApp
  plane: semantic
  requiredCapabilities: [assertScreenshot]
defaults:
  commandTimeoutMs: 30000
  cleanupTimeoutMs: 15000
  failFast: true
  evidence:
    screenshot: onFailure
    snapshot: onFailure
    failurePolicy: failStep
variables:
  visualBaseline:
    source: input
    type: string
  visualCaptureOptions:
    source: input
    type: json
setup:
  - stepId: verifyVisualInbox
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
steps:
  - stepId: settleVisualSurface
    action: {type: waitForUiIdle, quietMs: 300}
  - stepId: assertInboxScreenshot
    description: Compare the current Inbox with the baseline captured from this exact runtime profile.
    plane: semantic
    timeoutMs: 30000
    action:
      type: assertScreenshot
      baseline: {$var: visualBaseline}
      pixelTolerance: 0.1
      maxDifferingPixelRatio: 0.03
      artifactName: inbox-visual-regression
      captureOptions: {$var: visualCaptureOptions}
