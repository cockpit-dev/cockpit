schemaVersion: cockpit.test/v2
kind: case
id: demoNativeBlackBox
name: Native-plane black-box validation
description: Controls and validates the running app exclusively through the platform-native tree while the development session preserves app identity and isolation.
tags: [acceptance, black-box, native, requires-native-tree]
target:
  platform: flutter
  targetKind: flutterApp
  plane: native
  requiredCapabilities: [tap, waitFor, assertVisible, captureScreenshot]
defaults:
  commandTimeoutMs: 30000
  cleanupTimeoutMs: 90000
  failFast: true
  evidence:
    screenshot: onFailure
    snapshot: onFailure
    failurePolicy: failStep
setup:
  - stepId: recoverIndependentNativeTarget
    timeoutMs: 60000
    action:
      type: system
      name: recoverToApp
  - stepId: waitForNativeInbox
    timeoutMs: 30000
    action:
      type: waitFor
      condition:
        type: visible
        locator:
          label: New task
          fallbacks:
            - {text: New task}
steps:
  - stepId: assertInboxThroughNativeTree
    timeoutMs: 20000
    action:
      type: assertVisible
      locator:
        label: New task
        fallbacks:
          - {text: New task}
  - stepId: openEditorThroughNativeTree
    description: Retry native input only while the native tree proves the editor has not opened.
    timeoutMs: 60000
    retry:
      maxAttempts: 2
      delayMs: 750
      steps:
        - stepId: tapNewTaskIfInboxVisible
          timeoutMs: 30000
          if:
            condition:
              type: visible
              locator:
                label: New task
                fallbacks:
                  - {text: New task}
            then:
              - stepId: tapNewTaskThroughNativeTree
                timeoutMs: 30000
                action:
                  type: tap
                  locator:
                    label: New task
                    fallbacks:
                      - {text: New task}
            else:
              - stepId: retainCommittedNativeEditor
                action: {type: waitForUiIdle, quietMs: 100}
        - stepId: assertEditorThroughNativeTree
          timeoutMs: 20000
          action:
            type: assertVisible
            locator:
              label: Back
              type: Button
  - stepId: tapBackThroughNativeTree
    description: Commit the native back mutation once.
    timeoutMs: 30000
    action:
      type: tap
      locator:
        label: Back
        type: Button
        fallbacks:
          - {text: Back}
  - stepId: observeNativeInboxRestored
    description: Retry only the read-only inbox observation after native back succeeds.
    timeoutMs: 60000
    retry:
      maxAttempts: 3
      delayMs: 750
      steps:
        - stepId: assertNativeInboxRestored
          timeoutMs: 20000
          action:
            type: assertVisible
            locator:
              label: New task
              fallbacks:
                - {text: New task}
  - stepId: captureIndependentNativeEvidence
    timeoutMs: 60000
    action:
      type: captureScreenshot
      artifactName: native-plane-black-box
      captureOptions: {reason: acceptance, includeSnapshot: true, attachToStep: true, allowFallback: false}
finally:
  - stepId: recoverNativeTargetAfterCase
    timeoutMs: 60000
    action:
      type: system
      name: recoverToApp
  - stepId: restoreNativeInboxIfNeeded
    description: Inspect the current native route before applying a cleanup mutation.
    timeoutMs: 60000
    if:
      condition:
        type: visible
        locator:
          label: New task
          fallbacks:
            - {text: New task}
      then:
        - stepId: retainNativeInbox
          action: {type: waitForUiIdle, quietMs: 100}
      else:
        - stepId: closeNativeEditorIfPresent
          timeoutMs: 40000
          if:
            condition:
              type: visible
              locator:
                label: Back
                type: Button
                fallbacks:
                  - {text: Back}
            then:
              - stepId: tapNativeBackDuringCleanup
                timeoutMs: 20000
                action:
                  type: tap
                  locator:
                    label: Back
                    type: Button
                    fallbacks:
                      - {text: Back}
            else:
              - stepId: retainUnknownNativeRoute
                action: {type: waitForUiIdle, quietMs: 100}
  - stepId: verifyNativeCleanupInbox
    timeoutMs: 45000
    retry:
      maxAttempts: 2
      delayMs: 750
      steps:
        - stepId: assertNativeCleanupInbox
          timeoutMs: 20000
          action:
            type: assertVisible
            locator:
              label: New task
              fallbacks:
                - {text: New task}
