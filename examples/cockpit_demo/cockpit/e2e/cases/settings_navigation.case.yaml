schemaVersion: cockpit.test/v2
kind: case
id: demoSettingsNavigation
name: Settings navigation
description: Verifies route navigation, assertions, and portable visual evidence.
tags: [acceptance, navigation]
target:
  platform: flutter
  targetKind: flutterApp
  plane: semantic
defaults:
  commandTimeoutMs: 20000
  cleanupTimeoutMs: 15000
  failFast: true
  evidence:
    screenshot: onFailure
    snapshot: onFailure
    failurePolicy: recordWarning
steps:
  - stepId: waitForInbox
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
  - stepId: openSettings
    action:
      type: tap
      locator: {testId: open-settings-action}
  - stepId: waitForSettings
    action:
      type: waitFor
      condition: {type: route, route: /settings}
  - stepId: verifySettingsContent
    timeoutMs: 10000
    evidence:
      screenshot: always
      snapshot: always
      failurePolicy: failStep
    action:
      type: assertVisible
      locator: {text: Tune the workspace.}
  - stepId: captureSettings
    timeoutMs: 60000
    action:
      type: captureScreenshot
      artifactName: settings-navigation
      captureOptions:
        reason: acceptance
        profile: flutterPreferred
        allowFallback: false
finally:
  - stepId: returnToInbox
    timeoutMs: 20000
    action: {type: back}
  - stepId: verifyInboxRestored
    timeoutMs: 20000
    action:
      type: waitFor
      condition: {type: route, route: /inbox}
