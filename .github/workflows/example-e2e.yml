name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MINIMUM_FLUTTER_VERSION: '3.32.0'
  CURRENT_FLUTTER_VERSION: '3.44.0'

jobs:
  static_analysis:
    name: formatting and analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CURRENT_FLUTTER_VERSION }}
          channel: stable

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/cockpit_protocol packages/flutter_cockpit packages/cockpit
          packages/cockpit_console examples/cockpit_demo test

      - name: Analyze workspace
        run: dart analyze

  minimum_flutter:
    name: minimum Flutter compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.MINIMUM_FLUTTER_VERSION }}
          channel: stable

      - name: Prepare minimum Flutter workspace
        run: bash .github/scripts/prepare-minimum-flutter-workspace.sh

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Analyze minimum-version packages
        run: |
          dart analyze packages/cockpit_protocol
          dart analyze packages/flutter_cockpit
          dart analyze packages/cockpit
          dart analyze examples/cockpit_demo
          dart analyze examples/cockpit_demo/cockpit

  dart_tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repository contracts
            directory: .
            command: dart test test
          - name: protocol tests
            directory: packages/cockpit_protocol
            command: dart test
          - name: cockpit runtime tests
            directory: packages/cockpit
            command: dart test
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.MINIMUM_FLUTTER_VERSION }}
          channel: stable

      - name: Prepare minimum Flutter workspace
        run: bash .github/scripts/prepare-minimum-flutter-workspace.sh

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Run ${{ matrix.name }}
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  flutter_tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Flutter bridge tests
            directory: packages/flutter_cockpit
            flutter-version: '3.32.0'
          - name: production example tests
            directory: examples/cockpit_demo
            flutter-version: '3.32.0'
          - name: development shell tests
            directory: examples/cockpit_demo/cockpit
            flutter-version: '3.32.0'
          - name: Cockpit Console tests
            directory: packages/cockpit_console
            flutter-version: '3.44.0'
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable

      - name: Prepare minimum Flutter workspace
        if: matrix.flutter-version == '3.32.0'
        run: bash .github/scripts/prepare-minimum-flutter-workspace.sh

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Run ${{ matrix.name }}
        working-directory: ${{ matrix.directory }}
        run: flutter test

  publication:
    name: publish ${{ matrix.package }} dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cockpit_protocol
            directory: packages/cockpit_protocol
            command: dart pub publish --dry-run
          - package: flutter_cockpit
            directory: packages/flutter_cockpit
            command: flutter pub publish --dry-run
          - package: cockpit
            directory: packages/cockpit
            command: dart pub publish --dry-run
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.MINIMUM_FLUTTER_VERSION }}
          channel: stable

      - name: Prepare minimum Flutter workspace
        run: bash .github/scripts/prepare-minimum-flutter-workspace.sh

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Validate ${{ matrix.package }} publication
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  darwin_packaging:
    name: Darwin ${{ matrix.label }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: cocoapods
            label: CocoaPods
            flutter-version: '3.32.0'
          - manager: swiftpm
            label: SwiftPM
            flutter-version: '3.44.0'
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable

      - name: Select CocoaPods integration
        if: matrix.manager == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager

      - name: Select SwiftPM integration
        if: matrix.manager == 'swiftpm'
        run: >-
          flutter config --enable-swift-package-manager
          --no-enable-uiscene-migration

      - name: Prepare a SwiftPM-only development shell
        if: matrix.manager == 'swiftpm'
        working-directory: examples/cockpit_demo/cockpit
        run: |
          (cd ios && pod deintegrate)
          (cd macos && pod deintegrate)
          rm ios/Podfile ios/Podfile.lock macos/Podfile macos/Podfile.lock
          sed -i '' '/Pods\/Target Support Files\/Pods-Runner/d' \
            ios/Flutter/Debug.xcconfig \
            ios/Flutter/Release.xcconfig \
            macos/Flutter/Flutter-Debug.xcconfig \
            macos/Flutter/Flutter-Release.xcconfig
          perl -0pi -e \
            's/\s*<FileRef\s+location = "group:Pods\/Pods\.xcodeproj">\s*<\/FileRef>//g' \
            ios/Runner.xcworkspace/contents.xcworkspacedata \
            macos/Runner.xcworkspace/contents.xcworkspacedata

      - name: Prepare minimum Flutter workspace
        if: matrix.manager == 'cocoapods'
        run: bash .github/scripts/prepare-minimum-flutter-workspace.sh

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Validate iOS CocoaPods package
        if: matrix.manager == 'cocoapods'
        run: |
          pod lib lint packages/flutter_cockpit/ios/flutter_cockpit.podspec --configuration=Debug --skip-tests --use-modular-headers
          pod lib lint packages/flutter_cockpit/ios/flutter_cockpit.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries

      - name: Validate macOS CocoaPods package
        if: matrix.manager == 'cocoapods'
        run: |
          pod lib lint packages/flutter_cockpit/macos/flutter_cockpit.podspec --configuration=Debug --skip-tests --use-modular-headers
          pod lib lint packages/flutter_cockpit/macos/flutter_cockpit.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries

      - name: Build macOS with ${{ matrix.label }}
        working-directory: examples/cockpit_demo/cockpit
        run: flutter build macos --debug --target main.dart

      - name: Build iOS Simulator with ${{ matrix.label }}
        working-directory: examples/cockpit_demo/cockpit
        run: >-
          flutter build ios --simulator --debug --no-codesign
          --target main.dart

      - name: Verify CocoaPods linked flutter_cockpit
        if: matrix.manager == 'cocoapods'
        working-directory: examples/cockpit_demo/cockpit
        run: |
          grep -q 'flutter_cockpit' macos/Podfile.lock
          grep -q 'flutter_cockpit' ios/Podfile.lock

      - name: Verify SwiftPM linked flutter_cockpit
        if: matrix.manager == 'swiftpm'
        working-directory: examples/cockpit_demo/cockpit
        run: |
          grep -q 'flutter_cockpit' macos/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          grep -q 'flutter_cockpit' ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift

  regression:
    name: ${{ matrix.platform }} regression
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            visual_args: --visual-profile pixel-7-api-34-1080x2400
            platform_tests: >-
              test/src/platform/android
              test/src/capture/cockpit_adb_capture_adapter_test.dart
              test/src/recording/cockpit_adb_recording_adapter_test.dart
              test/src/session/cockpit_remote_session_launcher_test.dart
          - platform: ios
            os: macos-latest
            visual_args: --visual-profile iphone-16-pro-1206x2622
            platform_tests: >-
              test/src/platform/ios
              test/src/capture/cockpit_simctl_capture_adapter_test.dart
              test/src/recording/cockpit_simctl_recording_adapter_test.dart
              test/src/session/cockpit_remote_session_launcher_test.dart
          - platform: macos
            os: macos-latest
            visual_args: --visual-profile macos-800x600
            platform_tests: >-
              test/src/platform/macos
              test/src/capture/cockpit_macos_capture_adapter_test.dart
              test/src/recording/cockpit_macos_recording_adapter_test.dart
              test/src/session/cockpit_macos_remote_session_launcher_test.dart
          - platform: linux
            os: ubuntu-latest
            visual_args: --visual-profile linux-1280x720
            platform_tests: >-
              test/src/platform/linux
              test/src/capture/cockpit_linux_capture_adapter_test.dart
              test/src/recording/cockpit_linux_recording_adapter_test.dart
              test/src/session/cockpit_linux_remote_session_launcher_test.dart
          - platform: web
            os: ubuntu-latest
            visual_args: ''
            platform_tests: >-
              test/src/platform/web
              test/src/bridge/cockpit_web_remote_session_bridge_server_test.dart
          - platform: windows
            os: windows-2022
            visual_args: --visual-profile windows-1028x681
            platform_tests: >-
              test/src/platform/windows
              test/src/capture/cockpit_windows_capture_adapter_test.dart
              test/src/recording/cockpit_windows_recording_adapter_test.dart
              test/src/session/cockpit_windows_remote_session_launcher_test.dart
    env:
      COCKPIT_HOME: ${{ github.workspace }}/cockpit-ci-home
      ACCEPTANCE_OUTPUT: ${{ github.workspace }}/cockpit-ci-acceptance

    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
        with:
          arch: x64

      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        if: matrix.platform == 'android'
        with:
          gradle-version: '8.14'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CURRENT_FLUTTER_VERSION }}
          channel: stable

      - name: Configure short Windows runtime paths
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'C:\ch', 'C:\ca' -Force | Out-Null
          'COCKPIT_HOME=C:\ch' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'ACCEPTANCE_OUTPUT=C:\ca' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable KVM
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash "$GITHUB_WORKSPACE/.github/scripts/install-android-sdk-for-emulator-runner.sh"

      - name: Install Linux runtime dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'web'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils xdotool imagemagick ffmpeg clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Start Linux display server
        if: matrix.platform == 'linux' || matrix.platform == 'web'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/xvfb.log" >&2
          exit 1

      - name: Enable desktop target
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Configure iOS tooling
        if: matrix.platform == 'ios'
        shell: bash
        run: flutter config --no-enable-swift-package-manager

      - name: Bootstrap workspace
        shell: bash
        run: flutter pub get

      - name: Bootstrap development shell
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: flutter pub get

      - name: Build Android black-box driver
        if: matrix.platform == 'android'
        shell: bash
        run: >-
          gradle -p packages/cockpit/tool/android_driver
          publishDriver

      - name: Run ${{ matrix.platform }} platform tests
        working-directory: packages/cockpit
        shell: bash
        run: dart test ${{ matrix.platform_tests }}

      - name: Configure isolated CI authorization
        shell: bash
        run: |
          dart run cockpit daemon policy apply \
            --file examples/cockpit_demo/cockpit/e2e/authorization.ci.json
          dart run cockpit daemon start --yolo

      - name: Prepare trusted Windows workspace
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $workspace = Join-Path $env:USERPROFILE 'cockpit-ci-workspace'
          & robocopy $env:GITHUB_WORKSPACE $workspace /MIR /XD .git cockpit-ci-home cockpit-ci-acceptance /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          $owner = "$env:USERDOMAIN\$env:USERNAME"
          & icacls.exe $workspace /setowner $owner /T /C
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $workspace
          flutter pub get
          Set-Location (Join-Path $workspace 'examples\cockpit_demo\cockpit')
          flutter pub get
          "COCKPIT_WINDOWS_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Boot iOS simulator
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          IOS_RUNTIME_ID="$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("identifier", "")]
          runtimes.sort(key=lambda r: tuple(int(p) for p in r.get("version", "0").split(".")))
          print(runtimes[-1]["identifier"] if runtimes else "")
          ')"
          IOS_DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = [d for d in json.load(sys.stdin)["devicetypes"] if d.get("name") == "iPhone 16 Pro"]
          print(types[0]["identifier"] if types else "")
          ')"
          if [[ -z "$IOS_RUNTIME_ID" || -z "$IOS_DEVICE_TYPE_ID" ]]; then
            echo "The exact iPhone 16 Pro visual profile is unavailable." >&2
            exit 1
          fi
          IOS_DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get(sys.argv[1], [])
          matches = [d for d in devices if d.get("isAvailable") and d.get("name") == "iPhone 16 Pro"]
          print(matches[0]["udid"] if matches else "")
          ' "$IOS_RUNTIME_ID")"
          if [[ -z "$IOS_DEVICE_ID" ]]; then
            IOS_DEVICE_ID="$(xcrun simctl create "Cockpit iPhone 16 Pro" "$IOS_DEVICE_TYPE_ID" "$IOS_RUNTIME_ID")"
          fi
          xcrun simctl boot "$IOS_DEVICE_ID" || true
          xcrun simctl bootstatus "$IOS_DEVICE_ID" -b
          xcrun simctl list devices "$IOS_RUNTIME_ID"
          echo "IOS_DEVICE_ID=$IOS_DEVICE_ID" >> "$GITHUB_ENV"

      - name: Start iOS WebDriverAgent
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          WDA_VERSION='16.0.2'
          WDA_SHA512='a8fpGsoU0e2DIu/n9G7Z8MlOIWylsydincSFzqon8LF3hCkLmhWJsJ+vOKqC/NkG3v5yDie9Ak4xSjBCEvKCJA=='
          WDA_ARCHIVE="$RUNNER_TEMP/appium-webdriveragent.tgz"
          WDA_ROOT="$RUNNER_TEMP/appium-webdriveragent"
          WDA_DERIVED_DATA="$RUNNER_TEMP/cockpit-wda-derived-data"
          WDA_LOG="$ACCEPTANCE_OUTPUT/webdriveragent.log"
          mkdir -p "$WDA_ROOT" "$ACCEPTANCE_OUTPUT"
          curl --fail --location --retry 3 \
            "https://registry.npmjs.org/appium-webdriveragent/-/appium-webdriveragent-${WDA_VERSION}.tgz" \
            --output "$WDA_ARCHIVE"
          ACTUAL_SHA512="$(openssl dgst -sha512 -binary "$WDA_ARCHIVE" | openssl base64 -A)"
          if [[ "$ACTUAL_SHA512" != "$WDA_SHA512" ]]; then
            echo 'WebDriverAgent archive digest mismatch.' >&2
            exit 1
          fi
          tar -xzf "$WDA_ARCHIVE" -C "$WDA_ROOT" --strip-components=1
          nohup env USE_PORT=8100 MJPEG_SERVER_PORT=9100 xcodebuild \
            -project "$WDA_ROOT/WebDriverAgent.xcodeproj" \
            -scheme WebDriverAgentRunner \
            -destination "platform=iOS Simulator,id=$IOS_DEVICE_ID" \
            -derivedDataPath "$WDA_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            test >"$WDA_LOG" 2>&1 &
          WDA_PID=$!
          echo "WDA_PID=$WDA_PID" >> "$GITHUB_ENV"
          echo 'IOS_WDA_URL=http://127.0.0.1:8100' >> "$GITHUB_ENV"
          for _ in $(seq 1 600); do
            if curl --silent --fail \
              http://127.0.0.1:8100/status >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$WDA_PID" 2>/dev/null; then
              tail -200 "$WDA_LOG" >&2
              exit 1
            fi
            sleep 1
          done
          tail -200 "$WDA_LOG" >&2
          exit 1

      - name: Run Android regression
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -camera-back none -camera-front none
          script: >-
            cd "$GITHUB_WORKSPACE/examples/cockpit_demo/cockpit" &&
            dart run tool/verify.dart --platform android
            ${{ matrix.visual_args }}
            --output-root "$ACCEPTANCE_OUTPUT" --require-recording
            --require-native-locator
            --stop-daemon

      - name: Run iOS regression
        if: matrix.platform == 'ios'
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: >-
          dart run tool/verify.dart --platform ios
          --device-id "$IOS_DEVICE_ID"
          --wda-url "$IOS_WDA_URL"
          ${{ matrix.visual_args }}
          --output-root "$ACCEPTANCE_OUTPUT" --require-recording
          --require-native-locator
          --stop-daemon

      - name: Run macOS regression
        if: matrix.platform == 'macos'
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: >-
          dart run tool/verify.dart --platform macos
          ${{ matrix.visual_args }}
          --output-root "$ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Run headless regression
        if: matrix.platform == 'linux' || matrix.platform == 'web'
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: >-
          dart run tool/verify.dart
          --platform ${{ matrix.platform }}
          ${{ matrix.visual_args }}
          --output-root "$ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Run Windows regression
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:COCKPIT_WINDOWS_WORKSPACE 'examples\cockpit_demo\cockpit')
          dart run tool/verify.dart --platform windows ${{ matrix.visual_args }} --output-root "$env:ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Collect Windows build diagnostics
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:COCKPIT_WINDOWS_WORKSPACE 'examples\cockpit_demo\cockpit\build\windows\x64'
          $destination = Join-Path $env:ACCEPTANCE_OUTPUT 'cmake'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          @(
            'CMakeCache.txt',
            'CMakeFiles\CMakeConfigureLog.yaml',
            'CMakeFiles\CMakeError.log',
            'CMakeFiles\CMakeOutput.log'
          ) | ForEach-Object {
            $path = Join-Path $source $_
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              Copy-Item -LiteralPath $path -Destination $destination
            }
          }

      - name: Stop iOS WebDriverAgent
        if: always() && matrix.platform == 'ios'
        shell: bash
        run: |
          if [[ -n "${WDA_PID:-}" ]]; then
            kill "$WDA_PID" 2>/dev/null || true
          fi
          if [[ -n "${IOS_DEVICE_ID:-}" ]]; then
            xcrun simctl terminate "$IOS_DEVICE_ID" \
              com.facebook.WebDriverAgentRunner.xctrunner 2>/dev/null || true
          fi

      - name: Stop Linux display server
        if: always() && (matrix.platform == 'linux' || matrix.platform == 'web')
        shell: bash
        run: |
          if [[ -n "${XVFB_PID:-}" ]]; then
            kill "$XVFB_PID" 2>/dev/null || true
          fi

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-3-${{ matrix.platform }}-regression
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.ACCEPTANCE_OUTPUT }}
            ${{ env.COCKPIT_HOME }}/daemon.log

  release_gate:
    name: release gate
    if: always()
    needs:
      - static_analysis
      - minimum_flutter
      - dart_tests
      - flutter_tests
      - publication
      - darwin_packaging
      - regression
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel gate
        env:
          STATIC_ANALYSIS: ${{ needs.static_analysis.result }}
          MINIMUM_FLUTTER: ${{ needs.minimum_flutter.result }}
          DART_TESTS: ${{ needs.dart_tests.result }}
          FLUTTER_TESTS: ${{ needs.flutter_tests.result }}
          PUBLICATION: ${{ needs.publication.result }}
          DARWIN_PACKAGING: ${{ needs.darwin_packaging.result }}
          REGRESSION: ${{ needs.regression.result }}
        run: |
          for result in \
            "$STATIC_ANALYSIS" \
            "$MINIMUM_FLUTTER" \
            "$DART_TESTS" \
            "$FLUTTER_TESTS" \
            "$PUBLICATION" \
            "$DARWIN_PACKAGING" \
            "$REGRESSION"; do
            if [[ "$result" != "success" ]]; then
              echo "Required gate finished with: $result"
              exit 1
            fi
          done
