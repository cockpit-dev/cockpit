name: cockpit-2-release-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  quality:
    name: complete quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Bootstrap workspace
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/flutter_cockpit packages/cockpit examples/cockpit_demo test

      - name: Analyze workspace
        run: dart analyze

      - name: Verify repository contracts
        run: dart test test

      - name: Verify protocol package
        working-directory: packages/cockpit_protocol
        run: dart test

      - name: Verify Cockpit runtime
        working-directory: packages/cockpit
        run: dart test

      - name: Verify Flutter bridge
        working-directory: packages/flutter_cockpit
        run: flutter test

      - name: Verify production example
        working-directory: examples/cockpit_demo
        run: flutter test

      - name: Verify development shell
        working-directory: examples/cockpit_demo/cockpit
        run: flutter test

      - name: Validate cockpit_protocol publication
        working-directory: packages/cockpit_protocol
        run: dart pub publish --dry-run

      - name: Validate flutter_cockpit publication
        working-directory: packages/flutter_cockpit
        run: flutter pub publish --dry-run

      - name: Validate cockpit publication
        working-directory: packages/cockpit
        run: dart pub publish --dry-run

  regression:
    name: ${{ matrix.platform }} regression
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: web
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
    env:
      COCKPIT_HOME: ${{ github.workspace }}/cockpit-ci-home
      ACCEPTANCE_OUTPUT: ${{ github.workspace }}/cockpit-ci-acceptance

    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
        with:
          arch: x64

      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Configure short Windows runtime paths
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'C:\ch', 'C:\ca' -Force | Out-Null
          'COCKPIT_HOME=C:\ch' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'ACCEPTANCE_OUTPUT=C:\ca' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable KVM
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash "$GITHUB_WORKSPACE/.github/scripts/install-android-sdk-for-emulator-runner.sh"

      - name: Install Linux runtime dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'web'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Enable desktop target
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Configure iOS tooling
        if: matrix.platform == 'ios'
        shell: bash
        run: flutter config --no-enable-swift-package-manager

      - name: Bootstrap workspace
        shell: bash
        run: flutter pub get

      - name: Bootstrap development shell
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: flutter pub get

      - name: Apply isolated CI authorization
        shell: bash
        run: >-
          dart run cockpit daemon policy apply
          --file examples/cockpit_demo/cockpit/e2e/authorization.ci.json

      - name: Prepare trusted Windows workspace
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $workspace = Join-Path $env:USERPROFILE 'cockpit-ci-workspace'
          & robocopy $env:GITHUB_WORKSPACE $workspace /MIR /XD .git cockpit-ci-home cockpit-ci-acceptance /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          $owner = "$env:USERDOMAIN\$env:USERNAME"
          & icacls.exe $workspace /setowner $owner /T /C
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $workspace
          flutter pub get
          Set-Location (Join-Path $workspace 'examples\cockpit_demo\cockpit')
          flutter pub get
          "COCKPIT_WINDOWS_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Boot iOS simulator
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          IOS_DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          devices = [d for runtime, entries in data.items() if "iOS" in runtime for d in entries if d.get("isAvailable") and "iPhone" in d.get("name", "")]
          if not devices: raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          ')"
          xcrun simctl boot "$IOS_DEVICE_ID" || true
          xcrun simctl bootstatus "$IOS_DEVICE_ID" -b
          echo "IOS_DEVICE_ID=$IOS_DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run Android regression
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -camera-back none -camera-front none
          script: >-
            cd "$GITHUB_WORKSPACE/examples/cockpit_demo/cockpit" &&
            dart run tool/verify.dart --platform android
            --output-root "$ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Run iOS regression
        if: matrix.platform == 'ios'
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: >-
          dart run tool/verify.dart --platform ios
          --device-id "$IOS_DEVICE_ID"
          --output-root "$ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Run macOS regression
        if: matrix.platform == 'macos'
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: >-
          dart run tool/verify.dart --platform macos
          --output-root "$ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Run headless regression
        if: matrix.platform == 'linux' || matrix.platform == 'web'
        working-directory: examples/cockpit_demo/cockpit
        shell: bash
        run: >-
          xvfb-run -a dart run tool/verify.dart
          --platform ${{ matrix.platform }}
          --output-root "$ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Run Windows regression
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:COCKPIT_WINDOWS_WORKSPACE 'examples\cockpit_demo\cockpit')
          dart run tool/verify.dart --platform windows --output-root "$env:ACCEPTANCE_OUTPUT" --stop-daemon

      - name: Collect Windows build diagnostics
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:COCKPIT_WINDOWS_WORKSPACE 'examples\cockpit_demo\cockpit\build\windows\x64'
          $destination = Join-Path $env:ACCEPTANCE_OUTPUT 'cmake'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          @(
            'CMakeCache.txt',
            'CMakeFiles\CMakeConfigureLog.yaml',
            'CMakeFiles\CMakeError.log',
            'CMakeFiles\CMakeOutput.log'
          ) | ForEach-Object {
            $path = Join-Path $source $_
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              Copy-Item -LiteralPath $path -Destination $destination
            }
          }

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-2-${{ matrix.platform }}-regression
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.ACCEPTANCE_OUTPUT }}
            ${{ env.COCKPIT_HOME }}/daemon.log
